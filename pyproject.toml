# Konfiguracja narzędzi deweloperskich (lint/format). Obie bramki blokują w CI:
# ruff check (od US-002) i ruff format --check (od US-020). Wersja ruff jest przypięta
# w dev-requirements.txt, ci.yml i .pre-commit-config.yaml — zmieniaj ją wszędzie naraz. Lokalnie:
#   pip install -r dev-requirements.txt
#   ruff check .        # tylko realne błędy (F) + wybrane E/W
#   ruff format .       # formatowanie

[tool.ruff]
line-length = 100
target-version = "py311"
# Wyłączone z lintu — duże/wygenerowane lub zewnętrzne pliki.
extend-exclude = [
    "static/design",
    "app.py.bak",
    "*.xlsx",
    "instance",
]

[tool.ruff.lint]
# Lenient na start: tylko wysokosygnałowe reguły (pyflakes = realne błędy:
# niezdefiniowane nazwy, nieużywane importy/zmienne), plus podstawowe E/W.
# Świadomie pomijamy E501 (długość linii) i resztę, by lint nie tonął w szumie
# na 15k-liniowym app.py — można dokręcać stopniowo.
select = ["F", "E9", "W6"]
ignore = ["F401"]   # nieużywane importy bywają celowe (lazy/optional) — włączyć po przeglądzie

[tool.ruff.format]
quote-style = "preserve"
