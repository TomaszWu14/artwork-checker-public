name: CI

# Bramka jakości na każdy push do main i każdy PR (ADR-0002):
#   lint → składnia + testy → SAST (Bandit, Semgrep) → SCA (pip-audit) → sekrety (gitleaks) → konfiguracja (Trivy)
# Blokują: compileall, pytest, Bandit (≥ średnie), pip-audit (prod lock), npm audit (runtime, HIGH+), gitleaks,
# Trivy (HIGH/CRITICAL), Semgrep p/owasp-top-ten dla NOWYCH znalezisk w PR (--baseline-commit).
# Blokuje też ruff check (od US-002) i ruff format --check (od US-020). Doradcze (continue-on-error na KROKU —
# job zielony z ostrzeżeniem; termin w ADR-0002 / RYZYKA.md W-03): pełny Semgrep (do pierwszego triage),
# pip-audit obrazu ML (requirements-ml.lock), npm audit narzędzi builda.
# Akcje przypięte do SHA (komentarz = wersja; aktualizuje Dependabot), gitleaks/Trivy — wersja + sha256.
# Skan obrazu Docker (ciężki, ~8 min) jest w security.yml (ręcznie / co miesiąc).

on:
  push:
    branches: [main]
  pull_request:
    # Bez filtra gałęzi bazowej: PR-y „stacked” (baza = inna gałąź feature, np. #22 na #17)
    # też muszą przejść bramkę — z filtrem [main] nie miały żadnego przebiegu CI (US-002).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # US-013 (decyzja PO 2026-10-17, Z-05): zestaw „logiki domenowej” objęty progiem pokrycia ≥ 80 % (łącznie).
  # Zmiana listy lub progu = decyzja PO (docs/testy/STRATEGIA_TESTOW.md; pilnuje tests/test_us013_coverage_gate.py).
  DOMAIN_COVERAGE_MODULES: "artwork_index.py,artwork_naming.py,artwork_report_engine.py,barcode_validator.py,material_master.py,material_uom.py,normalizer.py,supplier_master.py,uom.py"
  DOMAIN_COVERAGE_MIN: "80"

jobs:
  lint:
    name: Lint (ruff check + ruff format --check — blokują)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalacja ruff
        run: pip install "ruff==0.17.1"   # US-020: ta sama wersja co dev-requirements.txt i pre-commit
      - name: ruff check (reguły F, E9, W6 z pyproject.toml) — BLOKUJE od US-002
        run: ruff check . --output-format github
      - name: "ruff format --check — BLOKUJE od US-020 (naprawa: ruff format . w wersji z dev-requirements.txt)"
        run: ruff format --check --diff .

  tests:
    name: Składnia + testy (pytest)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Kompilacja składni całego repo
        run: python -m compileall -q . -x 'static/design|\.git'
      - name: Instalacja zależności testowych (lekki zestaw, bez pakietów ML)
        run: pip install pytest pytest-cov python-dateutil dateparser babel flask werkzeug "rapidfuzz>=3.0,<4.0"
      - name: pytest + raport pokrycia całego repo (informacyjny)
        run: python -m pytest tests/ -q --cov=. --cov-report=xml --cov-report=term
      - name: "Pokrycie logiki domenowej ≥ 80 % — BLOKUJE od US-013 (Z-05)"
        run: python -m coverage report -m --include="$DOMAIN_COVERAGE_MODULES" --fail-under="$DOMAIN_COVERAGE_MIN"
      - name: Artefakt — pokrycie
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — build z repo zgodny ze źródłem (US-022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Instalacja przypiętych wersji (package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Build (vendor, JSX raportu, Tailwind)
        run: npm run build
      - name: "Zbudowane pliki w repo = wynik builda (inaczej: uruchom npm run build i zacommituj)"
        run: git diff --exit-code -- static/
      - name: "Wyrażenia Alpine zgodne z buildem CSP — bez eval (US-024)"
        run: node tools/check_alpine_csp.mjs
      # npm audit czyta package-lock.json. Zależności npm to wyłącznie narzędzia builda (devDependencies) —
      # bramka obejmuje to, co trafiłoby do runtime (--omit=dev); pełny audyt (z Tailwind 3 → braces/micromatch,
      # poprawka tylko w Tailwind 4 = zmiana major, do decyzji) jest doradczy.
      - name: "npm audit — zależności runtime (HIGH+) — BLOKUJE"
        run: npm audit --omit=dev --audit-level=high
      - name: "npm audit — narzędzia builda (doradczy)"
        continue-on-error: true
        run: npm audit --audit-level=high

  sast-bandit:
    name: SAST — Bandit (blokuje ≥ średnie)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalacja Bandit
        run: pip install "bandit[toml]==1.9.4"
      - name: "Skan (błąd przy problemach ≥ średnie; fałszywe alarmy oznaczane nosec z powodem)"
        run: bandit -r . -ll -x ./tests,./.git,./static/design
      - name: Raport JSON (wszystkie poziomy, do przeglądu)
        if: always()
        run: bandit -r . -x ./tests,./.git,./static/design -f json -o bandit.json || true
      - name: Artefakt — Bandit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-json
          path: bandit.json
          if-no-files-found: ignore

  sast-semgrep:
    name: SAST — Semgrep (bramka OWASP dla nowego kodu PR)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # --baseline-commit potrzebuje commita bazowego PR-a
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalacja Semgrep (przypięta wersja)
        run: pip install "semgrep==1.181.0"
      # Bramka: p/owasp-top-ten, tylko znaleziska NOWE względem bazy PR-a (--baseline-commit) — istniejące
      # znaleziska czekają na triage (W-03) i nie blokują. Fałszywy alarm: `# nosemgrep: <id>` z powodem obok.
      - name: "Semgrep p/owasp-top-ten — nowe znaleziska w PR — BLOKUJE"
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          semgrep scan --config p/owasp-top-ten --metrics off --error --text
          --baseline-commit "$BASE" --exclude static/design --exclude static/vendor --exclude tests
          --sarif-output semgrep-gate.sarif
      - name: Znaleziska bramki Semgrep jako adnotacje PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json, os
          if not os.path.exists("semgrep-gate.sarif"):
              print("brak semgrep-gate.sarif"); raise SystemExit(0)
          for run in json.load(open("semgrep-gate.sarif")).get("runs", []):
              for r in run.get("results", []):
                  loc = r["locations"][0]["physicalLocation"]
                  path, line = loc["artifactLocation"]["uri"], loc.get("region", {}).get("startLine", 1)
                  rule = r.get("ruleId", "").rsplit(".", 1)[-1]
                  print(f"::error file={path},line={line}::Semgrep {rule}")
              for inv in run.get("invocations", []):
                  for n in inv.get("toolExecutionNotifications", [])[:10]:
                      print("::warning::Semgrep: " + n.get("message", {}).get("text", "")[:300].replace("\n", " "))
          PY
      - name: Skan regułami OWASP / Flask / Python (pełny, doradczy)
        if: always()
        continue-on-error: true   # doradczy do pierwszego triage (W-03) — ostrzeżenie, nie czerwony check
        run: >
          semgrep scan --config p/python --config p/flask --config p/owasp-top-ten
          --metrics off --exclude static/design --exclude tests --error --sarif --output semgrep.sarif
      - name: Artefakt — Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  sca-pip-audit:
    name: SCA — pip-audit (blokuje)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalacja pip-audit
        run: pip install "pip-audit==2.10.1"
      - name: Audyt zależności produkcyjnych (lockfile z hashami, US-011)
        run: pip-audit -r requirements-prod.lock --require-hashes --disable-pip --progress-spinner off -f json -o pip-audit.json
      - name: Podsumowanie
        if: always()
        run: |
          python - <<'PY'
          import json, os
          if not os.path.exists("pip-audit.json"):
              print("brak raportu"); raise SystemExit(0)
          d = json.load(open("pip-audit.json"))
          deps = d.get("dependencies", d if isinstance(d, list) else [])
          vulns = [(x.get("name"), x.get("version"), v.get("id")) for x in deps for v in x.get("vulns", [])]
          print(f"pakiety: {len(deps)}, podatności: {len(vulns)}")
          for v in vulns: print(" -", *v)
          PY
      # Obraz Docker (Dockerfile / Dockerfile.base) instaluje requirements-ml.lock. Znane CVE z poprawką tylko
      # w wersjach major poza zakresami requirements.txt (pillow<12, pypdf<5, transformers<5) — decyzja PO;
      # do tego czasu krok doradczy (ostrzeżenie w logu, nie czerwony check).
      - name: Audyt obrazu ML (requirements-ml.lock, doradczy)
        if: always()
        continue-on-error: true
        run: pip-audit -r requirements-ml.lock --require-hashes --disable-pip --progress-spinner off
      - name: Artefakt — pip-audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-audit-json
          path: pip-audit.json
          if-no-files-found: ignore

  secrets-gitleaks:
    name: Sekrety — gitleaks (blokuje)
    runs-on: ubuntu-latest
    needs: [sast-bandit, sast-semgrep, sca-pip-audit]
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # pełna historia — skan także starych commitów
      - name: Instalacja gitleaks (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: "gitleaks (konfiguracja i allowlista w .gitleaks.toml, wyjątki w .gitleaksignore)"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(git --redact --no-banner)
          # PR: tylko jego commity; push/ręcznie: cała historia.
          if [ -n "$BASE" ]; then args+=(--log-opts="$BASE..$HEAD"); fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}" .

  config-trivy:
    name: Konfiguracja i zależności — Trivy (blokuje HIGH/CRITICAL)
    runs-on: ubuntu-latest
    needs: [secrets-gitleaks]
    env:
      TRIVY_VERSION: 0.74.0
      TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalacja Trivy (przypięta wersja + sha256, bez skryptu z gałęzi main)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Skan plików (vuln, secret, misconfig — Dockerfile) — BLOKUJE HIGH/CRITICAL od US-012
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --format table .
      - name: Raport JSON
        if: always()
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format json --output trivy.json . || true
      - name: Artefakt — Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-json
          path: trivy.json
          if-no-files-found: ignore
