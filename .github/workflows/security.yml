name: security

# Cotygodniowe skany bezpieczeństwa (doradcze): Bandit (SAST Pythona),
# gitleaks (sekrety w kodzie i historii), Trivy (CVE w zależnościach
# i konfiguracji), pip-audit (CVE w requirements). Tylko harmonogram
# + ręczne odpalenie — oszczędza minuty Actions na prywatnym repo.

on:
  schedule:
    - cron: "0 6 1 * *"   # 1. dnia miesiaca
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalacja Bandit
        run: pip install "bandit[toml]==1.9.4"
      - name: Skan (błąd przy problemach ≥ średnie)
        run: bandit -r . -ll -x ./.venv,./venv,./node_modules,./.git

  gitleaks:
    name: gitleaks (sekrety)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # pełna historia — skan także starych commitów
      - name: Instalacja gitleaks (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: gitleaks — cała historia
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  trivy:
    name: Trivy (zależności + konfiguracja)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalacja Trivy (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Skan repozytorium (raport HIGH/CRITICAL w logu)
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 .

  pip-audit:
    name: pip-audit (CVE w zależnościach)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalacja pip-audit
        run: pip install "pip-audit==2.10.1"
      - name: Audyt plików requirements (doradczy)
        run: |
          found=0
          for f in requirements*.txt; do
            [ -f "$f" ] || continue
            found=1
            echo "── $f ──"
            pip-audit -r "$f" --progress-spinner off || true
          done
          [ "$found" = 1 ] || echo "Brak plików requirements*.txt — pomijam."

  trivy-image:
    # Skan OBRAZU Docker (pełny Dockerfile: torch + OCR, build ~8 min, kilka GB) — tylko na żądanie
    # (workflow_dispatch), by nie palić minut przy każdym PR (decyzja Z-05, ADR-0002).
    name: Trivy (obraz Docker) — tylko ręcznie
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zwolnij miejsce na dysku (obraz ML jest duży)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h
      - name: Build obrazu
        run: docker build -t artwork:scan .
      - name: Instalacja Trivy (przypięta wersja + sha256)
        working-directory: ${{ runner.temp }}
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          curl -sSfL -o trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Skan obrazu (HIGH/CRITICAL; doradczy do US-012)
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 artwork:scan
