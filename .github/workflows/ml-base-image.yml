name: Buduj obraz bazowy ML

# Buduje CIĘŻKI obraz bazowy (Dockerfile.base: torch + cała ML/OCR/CV) i wypycha
# go do GHCR. Dzięki temu właściwy deploy aplikacji (Dockerfile.slim) robi tylko
# `COPY . .` i trwa ~1 min zamiast 7-8.
#
# Odpala się:
#   • ręcznie (workflow_dispatch) — np. pierwsza publikacja,
#   • automatycznie po zmianie requirements.txt lub Dockerfile.base na main.
#
# Po PIERWSZEJ publikacji trzeba JEDNORAZOWO ustawić pakiet GHCR jako publiczny
# (albo dać Coolify dane logowania do GHCR) — szczegóły: docs/OBRAZ_BAZOWY_ML.md

on:
  # Publikacja tylko ręcznie (publish=true) — obraz ghcr.io/<owner>/artwork-ml-base, własny pakiet
  # tego repo (decyzja PO 2026-10-16: nie współdzielimy doccompare-ml-base ze starą apką).
  # PR zmieniający obraz lub lock → build + test
  # importów BEZ publikacji (US-021; inputs.publish poza workflow_dispatch jest puste).
  pull_request:
    paths:
      - Dockerfile.base
      - requirements-ml.lock
      - .github/workflows/ml-base-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Wypchnij do GHCR (:latest + :sha). Bez zaznaczenia — tylko build i test importów (US-021)."
        type: boolean
        default: false

# Nowy push do PR-a anuluje starszy przebieg (main zawsze do końca — od niego zależy deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Zwolnij miejsce na dysku (torch+paddle+doctr to kilka GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h

      - name: Nazwa właściciela małymi literami (wymóg GHCR)
        id: meta
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build obrazu bazowego (weryfikacja, bez publikacji)
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          load: true
          platforms: linux/amd64
          tags: artwork-ml-base:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Test obrazu: torch CPU, kluczowe pakiety ML, brak CUDA"
        if: ${{ !inputs.publish }}
        run: |
          docker run --rm artwork-ml-base:verify python -c "
          import torch, torchvision, transformers, cv2, fitz, sklearn, numpy
          print('torch', torch.__version__, '| torchvision', torchvision.__version__, '| transformers', transformers.__version__)
          assert '+cpu' in torch.__version__, 'torch nie jest w wariancie CPU'
          assert not torch.cuda.is_available()
          print('OK')
          "
          docker image ls artwork-ml-base:verify

      - name: Build + push obrazu bazowego
        if: inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/artwork-ml-base:latest
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/artwork-ml-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
