<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1119">
<title>Wylogowanie — Artwork</title>
{# US-017: GET /logout nie wylogowuje — potwierdzenie przez POST z tokenem CSRF. #}
<style>
:root{--bg:#0f1119;--surface:#181b27;--border:#252840;--accent:#5b9bff;--text:#edf0f7;--muted:#7a84a0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;
  width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
.sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.5}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:9px;
  font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.88}
.back{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Wylogować się?</h1>
  <p class="sub">Zalogowano jako <strong>{{ session.get('username', '') }}</strong>.</p>
  <form method="POST" action="/logout">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn">Wyloguj</button>
  </form>
  <a href="/" class="back">← Wróć do aplikacji</a>
</div>
</body>
</html>
